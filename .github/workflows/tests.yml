name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # After the install, so the two steps share one definition of what gets
      # linted (composer.json) instead of drifting apart.
      - name: PHP lint
        run: composer lint

      - name: Run unit tests
        run: composer test
